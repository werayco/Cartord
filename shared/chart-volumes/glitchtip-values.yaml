glitchtip:
  existingSecret: cartord-secrets
  existingSecretKey: SECRET_KEY
  domain: "https://errors.devrayco.name.ng"
  database:
    existingSecret: cartord-secrets
    existingSecretKey: DATABASE_URL
  valkey:
    existingSecret: ~

postgresql:
  enabled: false

valkey:
  enabled: true
  auth:
    enabled: false
  primary:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

