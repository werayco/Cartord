  auth_service:
    build:
      context: ../../services/auth_service
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "9001:9001"
    volumes:
      - "../../services/auth_service:/app/"
    env_file:
      - ./.env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9001", "--reload"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynet

  inventory_service:
    build:
      context: ../../services/inventory_service
      dockerfile: Dockerfile
    container_name: inventory_service
