services:
  postgres:
    image: postgres:16
    container_name: cartord-pg
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${DB_PORT}:5432"
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../init_scripts/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "for db in auth_db inventory_db order_db payment_db notification_db search_db glitchtip; do pg_isready -U rayco -d $$db || exit 1; done",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynet

  debezium:
    image: debezium/connect:2.7.3.Final 
    container_name: cartord-dz
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cartord-connect-cluster
      CONFIG_STORAGE_TOPIC: cartord_connect_configs
      OFFSET_STORAGE_TOPIC: cartord_connect_offsets
      STATUS_STORAGE_TOPIC: cartord_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mynet

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: cartord-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - mynet

  jaeger:
    container_name: cartord-jg
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686" # web ui
    networks:
      - mynet

  kafka:
    image: apache/kafka:3.8.0
    container_name: cartord-kf
    restart: unless-stopped
    ports:
      - "9092:9092"
    env_file:
      - ./.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - mynet

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080" # web ui
    environment:
      KAFKA_CLUSTERS_0_NAME: cartord
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - mynet

  redis:
    image: redis:7-alpine
    container_name: cartord-rd
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynet

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: cartord-gweb
    restart: unless-stopped
    command: sh -c "./manage.py migrate && ./bin/start.sh"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
    ports:
      - "8080:8000"
    networks:
      - mynet

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: cartord-gwork
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
    networks:
      - mynet

  prometheus:
    image: prom/prometheus:latest
    container_name: cartord-ph
    volumes:
      - ../bind_volumes/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - mynet

  grafana:
    image: grafana/grafana:latest
    container_name: cartord-gf
    ports:
      - "3000:3000" # web ui
    env_file:
      - ./.env
    depends_on:
      - prometheus
    networks:
      - mynet

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: cartord-oc
    restart: unless-stopped
    volumes:
      - ../bind_volumes/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # gRPC
      - "4318:4318" # http
    depends_on:
      - jaeger
      - prometheus
    networks:
      - mynet
  mailpit:
    image: axllent/mailpit:latest
    container_name: cartord-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # web ui
      - "1025:1025"   # SMTP port your notification_service connects to
    networks:
      - mynet

volumes:
  db_data:
  esdata:
  kafka_data:
  redis_data:

networks:
  mynet:
    external: true
