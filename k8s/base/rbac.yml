apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cartord-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cartord-developers-read
  namespace: default
subjects:
  - kind: Group
    # Must match the group supplied by your authentication system.
    name: cartord-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cartord-reader
  apiGroup: rbac.authorization.k8s.io