apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: default
  labels:
    app: search-service
    tier: backend

spec:
  replicas: 3
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: search-service
            topologyKey: "kubernetes.io/hostname"
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: search-service
              topologyKey: "topology.kubernetes.io/zone"
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: search-service
        image: werayco/search-service:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 9006
          protocol: TCP
          name: http
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
    
        envFrom:
          - secretRef:
              name: cartord-secrets
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        startupProbe:
          httpGet:
            path: /health/startup
            port: 9006
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        
        # Readiness probe - checks if pod is ready to receive traffic
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 9006
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        # Liveness probe - checks if pod is still alive
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 9006
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log/app
      
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
          medium: Memory
      - name: logs
        emptyDir:
          sizeLimit: 200Mi
      
      tolerations:
      - key: "critical-pod"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: default
  labels:
    app: search-service
    tier: backend
spec:
  type: ClusterIP
  ports:
  - port: 9006
    targetPort: 9006
    protocol: TCP
    name: http
  selector:
    app: search-service
