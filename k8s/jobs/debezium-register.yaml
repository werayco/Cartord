apiVersion: batch/v1
kind: Job
metadata:
  generateName: cartord-debezium-register-
  namespace: cartord
  labels:
    app.kubernetes.io/name: cartord-debezium-register
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartord-debezium-register
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register-connectors
          image: cartord-init:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - shared.init_scripts.debezium_setup
          env:
            - name: DEBEZIUM_URL
              value: http://debezium-connect:8083/connectors
            - name: POSTGRES_HOST
              value: cartord-postgres
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cartord-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cartord-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
