apiVersion: batch/v1
kind: Job
metadata:
  generateName: cartord-init-
  namespace: cartord
  labels:
    app.kubernetes.io/name: cartord-init
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cartord-init
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize
          image: cartord-init:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - python -m shared.init_scripts.create_topics && python -m shared.init_scripts.seed
          env:
            - name: INVENTORY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cartord-secrets
                  key: INVENTORY_DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: cartord-kafka:9092
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
