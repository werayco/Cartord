replicaCount: 1

image:
  repository: werayco/payment-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "payment-service"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 9005

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

command:
  - uvicorn
  - app.main:app
  - --host
  - "0.0.0.0"
  - --port
  - "9005"

env:
  - name: OTEL_SERVICE_NAME
    value: "payment_service"
  - name: SENTRY_DSN
    valueFrom:
      secretKeyRef:
        name: cartord-secrets
        key: GLITCHTIP_PAYMENT_DSN
  - name: AUTH_BASE_URL
    value: "http://auth-service:9001/api/v1"

envFrom:
  - secretRef:
      name: cartord-secrets